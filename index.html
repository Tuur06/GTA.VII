
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA 7 - Mini Open World</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #101014;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

canvas {
  display: block;
}

#hud {
  position: absolute;
  top: 20px;
  left: 20px;
  background: rgba(0,0,0,0.75);
  padding: 15px 20px;
  border-radius: 12px;
  border-left: 4px solid #65ff83;
}

#hud h1 {
  font-size: 22px;
  color: #65ff83;
  margin-bottom: 8px;
}

#hud p {
  font-size: 14px;
  margin-top: 4px;
}

#mission {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 240px;
  background: rgba(0,0,0,0.75);
  padding: 15px;
  border-radius: 12px;
}

#mission h2 {
  color: #ffdb55;
  font-size: 18px;
  margin-bottom: 8px;
}

#mission p {
  font-size: 14px;
}

#message {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  padding: 15px 25px;
  border-radius: 10px;
  font-size: 16px;
  text-align: center;
}

#map {
  position: absolute;
  right: 20px;
  bottom: 20px;
  width: 150px;
  height: 150px;
  border: 3px solid white;
  border-radius: 12px;
  background: #333;
}
</style>
</head>
<body>

<div id="hud">
  <h1>GTA 7</h1>
  <p id="mode">Mode: Te voet</p>
  <p id="speed">Speed: 0 km/h</p>
  <p>WASD | E | Shift</p>
</div>

<div id="mission">
  <h2>MISSION</h2>
  <p id="missionText">Ga naar de groene marker!</p>
  <p id="missionStatus">Status: Actief</p>
</div>

<div id="message">Welkom in de stad. Zoek de groene marker!</div>
<canvas id="game"></canvas>
<canvas id="map"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const mapCanvas = document.getElementById("map");
const mapCtx = mapCanvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

mapCanvas.width = 150;
mapCanvas.height = 150;

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

const world = {
  width: 2400,
  height: 2400
};

const player = {
  x: 1200,
  y: 1200,
  speed: 3,
  radius: 12
};

let inCar = false;

const car = {
  x: 1300,
  y: 1200,
  angle: 0,
  speed: 0,
  maxSpeed: 8
};

let mission = {
  x: 1700,
  y: 1700,
  complete: false
};

const buildings = [];

for (let x = 100; x < world.width; x += 300) {
  for (let y = 100; y < world.height; y += 300) {
    buildings.push({
      x: x,
      y: y,
      w: 120 + Math.random() * 100,
      h: 120 + Math.random() * 100,
      color: ["#55565c", "#68656b", "#45474c", "#79747a"][Math.floor(Math.random()*4)]
    });
  }
}

function drawWorld() {
  ctx.fillStyle = "#397744";
  ctx.fillRect(0, 0, world.width, world.height);

  // Roads
  ctx.fillStyle = "#303238";

  for (let x = 0; x < world.width; x += 300) {
    ctx.fillRect(x - 40, 0, 80, world.height);
  }

  for (let y = 0; y < world.height; y += 300) {
    ctx.fillRect(0, y - 40, world.width, 80);
  }

  // Road markings
  ctx.strokeStyle = "#e3e3b5";
  ctx.lineWidth = 3;
  ctx.setLineDash([20, 20]);

  for (let x = 0; x < world.width; x += 300) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, world.height);
    ctx.stroke();
  }

  for (let y = 0; y < world.height; y += 300) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(world.width, y);
    ctx.stroke();
  }

  ctx.setLineDash([]);

  // Buildings
  buildings.forEach(b => {
    ctx.fillStyle = "#222";
    ctx.fillRect(b.x + 8, b.y + 8, b.w, b.h);

    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);

    ctx.fillStyle = "#909399";
    ctx.fillRect(b.x + 8, b.y + 8, b.w - 16, 8);
  });
}

function drawPlayer() {
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius + 3, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#42a5f5";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
  ctx.fill();
}

function drawCar() {
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);

  ctx.fillStyle = "#111";
  ctx.fillRect(-22, -12, 44, 24);

  ctx.fillStyle = "#ff4444";
  ctx.fillRect(-20, -10, 40, 20);

  ctx.fillStyle = "#aee4ff";
  ctx.fillRect(-8, -8, 16, 16);

  ctx.fillStyle = "#ffe680";
  ctx.fillRect(17, -7, 3, 5);
  ctx.fillRect(17, 2, 3, 5);

  ctx.restore();
}

function drawMission() {
  if (mission.complete) return;

  ctx.fillStyle = "#7dff62";
  ctx.beginPath();
  ctx.arc(mission.x, mission.y, 30, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(mission.x, mission.y, 15, 0, Math.PI*2);
  ctx.fill();
}

function drawMap() {
  mapCtx.fillStyle = "#397744";
  mapCtx.fillRect(0, 0, 150, 150);

  mapCtx.fillStyle = "#303238";

  for (let x = 0; x < world.width; x += 300) {
    mapCtx.fillRect(x/world.width*150 - 3, 0, 6, 150);
  }

  for (let y = 0; y < world.height; y += 300) {
    mapCtx.fillRect(0, y/world.height*150 - 3, 150, 6);
  }

  mapCtx.fillStyle = "#777";
  buildings.forEach(b => {
    mapCtx.fillRect(
      b.x/world.width*150,
      b.y/world.height*150,
      b.w/world.width*150,
      b.h/world.height*150
    );
  });

  mapCtx.fillStyle = "#7dff62";
  mapCtx.beginPath();
  mapCtx.arc(mission.x/world.width*150, mission.y/world.height*150, 5, 0, Math.PI*2);
  mapCtx.fill();

  mapCtx.fillStyle = "#42a5f5";
  mapCtx.beginPath();
  mapCtx.arc(player.x/world.width*150, player.y/world.height*150, 4, 0, Math.PI*2);
  mapCtx.fill();
}

function update() {
  if (!inCar) {
    let speed = keys["shift"] ? 5 : player.speed;

    if (keys["w"]) player.y -= speed;
    if (keys["s"]) player.y += speed;
    if (keys["a"]) player.x -= speed;
    if (keys["d"]) player.x += speed;

    // Enter car
    if (keys["e"]) {
      const distance = Math.hypot(player.x-car.x, player.y-car.y);
      if (distance < 50) {
        inCar = true;
        document.getElementById("message").innerText = "Je zit in de auto!";
      }
    }

  } else {
    if (keys["w"]) car.speed += 0.15;
    if (keys["s"]) car.speed -= 0.15;

    car.speed *= 0.98;
    car.speed = Math.max(-3, Math.min(car.maxSpeed, car.speed));

    if (keys["a"]) car.angle -= 0.04;
    if (keys["d"]) car.angle += 0.04;

    car.x += Math.cos(car.angle) * car.speed;
    car.y += Math.sin(car.angle) * car.speed;

    player.x = car.x;
    player.y = car.y;

    if (keys["e"]) {
      inCar = false;
      player.x = car.x + 40;
      player.y = car.y + 20;
      car.speed = 0;
      document.getElementById("message").innerText = "Je bent uitgestapt!";
    }
  }

  // Boundaries
  player.x = Math.max(0, Math.min(world.width, player.x));
  player.y = Math.max(0, Math.min(world.height, player.y));
  car.x = Math.max(0, Math.min(world.width, car.x));
  car.y = Math.max(0, Math.min(world.height, car.y));

  // Mission check
  if (!mission.complete) {
    const distance = Math.hypot(player.x-mission.x, player.y-mission.y);

    if (distance < 45) {
      mission.complete = true;
      document.getElementById("missionText").innerText = "Checkpoint bereikt!";
      document.getElementById("missionStatus").innerText = "Status: Voltooid";
      document.getElementById("message").innerText = "MISSION COMPLETED!";
    }
  }

  document.getElementById("mode").innerText = inCar ? "Mode: Auto" : "Mode: Te voet";
  document.getElementById("speed").innerText = "Speed: " + Math.round(Math.abs(car.speed)*15) + " km/h";
}

function render() {
  update();

  // Camera
  const cameraX = player.x - canvas.width/2;
  const cameraY = player.y - canvas.height/2;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-cameraX, -cameraY);

  drawWorld();
  drawMission();
  drawCar();

  if (!inCar) drawPlayer();

  ctx.restore();

  drawMap();

  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
